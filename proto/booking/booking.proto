syntax = "proto3";

package booking;

option go_package = "github.com/Brrocat/car-sharing-protos;booking";

import "google/protobuf/timestamp.proto";

enum BookingStatus {
  PENDING = 0;
  CONFIRMED = 1;
  ACTIVE = 2;
  COMPLETED = 3;
  CANCELED = 4;
  EXPIRED = 5;
}

message Booking {
  string booking_id = 1;
  string user_id = 2;
  string vehicle_id = 3;
  BookingStatus status = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  double estimated_price = 9;
  string currency = 10;
  string pickup_location = 11;
  string dropoff_location = 12;
}

message CreateBookingRequest {
  string user_id = 1;
  string vehicle_id = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  string pickup_location = 5;
  string dropoff_location = 6;
}

message CreateBookingResponse {
  Booking booking = 1;
}

message ConfirmBookingRequest {
  string booking_id = 1;
}

message ConfirmBookingResponse {
  Booking booking = 1;
}

message CancelBookingRequest {
  string booking_id = 1;
  string reason = 2;
}

message CancelBookingResponse {
  bool success = 1;
}

message GetBookingRequest {
  string booking_id = 1;
}

message GetBookingResponse {
  Booking booking = 1;
}

message ListUserBookingsRequest {
  string user_id = 1;
  BookingStatus status = 2; // optional filter
  int32 page_size = 3;
  string page_token = 4;
}

message ListUserBookingsResponse {
  repeated Booking booking = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

service BookingService {
  rpc CreateBooking(CreateBookingRequest) returns (CreateBookingResponse);
  rpc Confirm(ConfirmBookingRequest) returns (ConfirmBookingResponse);
  rpc CancelBooking(CancelBookingRequest) returns (CancelBookingResponse);
  rpc GetBooking(GetBookingRequest) returns (GetBookingResponse);
  rpc ListUserBookings(ListUserBookingsRequest) returns (ListUserBookingsResponse);
}


syntax = "proto3";

package userprofile;

option go_package = "github.com/Brrocat/car-sharing;userprofile";

import "google/protobuf/timestamp.proto";

message UserProfile {
  string user_id = 1;
  string email = 2;
  string fist_name = 3;
  string last_name = 4;
  string phone = 5;
  string data_of_of_birth = 6; // YYYY-MM-DD format
  string avatar_url = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message GetUserProfileRequest {
  string user_id = 1;
}

message GetUserProfileResponse {
  UserProfile profile = 1;
}

message CreateUserProfileRequest {
  string user_id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  string data_of_birth = 6;
}

message CreateUserProfileResponse {
  UserProfile profile = 1;
}

message UpdateUserProfileRequest {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string phone = 4;
  string data_of_birth = 5;
  string avatar_url = 6;
}

message UpdateUserProfileResponse {
  UserProfile profile = 1;
}

message DeleteUserProfileRequest {
  string user_id = 1;
}

message DeleteUserProfileResponse {
  bool success = 1;
}

service UserProfileService {
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  rpc CreateUserProfile(CreateUserProfileRequest) returns (CreateUserProfileResponse);
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UpdateUserProfileResponse);
  rpc DeleteUserProfile(DeleteUserProfileRequest) returns (DeleteUserProfileResponse);
 }